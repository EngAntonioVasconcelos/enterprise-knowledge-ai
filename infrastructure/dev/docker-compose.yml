# PostgreSQL for local development.
# Data is kept in the named volume eka_dev_pgdata, so it survives restarts
# and "docker compose down". Only "docker compose down -v" deletes it.
# Values come from infrastructure/dev/.env (never committed); see
# docs/development/dev-database.md.
services:
  postgres:
    # PostgreSQL 18 with pgvector 0.8.2 (vector search, Phase 6).
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: eka-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:1996:5432"
    volumes:
      - eka_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The backend tools (tests, migrations, evaluations) in Linux, so the
  # Windows Python and its app controls are not involved. Profile tools:
  # not started by "up". See docs/development/backend-container.md.
  backend:
    profiles: ["tools"]
    build:
      context: ../../backend
    image: eka-backend:dev
    volumes:
      - ../../backend:/app/backend
    environment:
      # The disposable test database on the host (throwaway credentials).
      EKA_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://eka_test_admin:local-test-admin-only@host.docker.internal:1999/eka_test

  # The backend API for the web app (profile app). Same image as the
  # tools; reloads when the code changes.
  api:
    profiles: ["app"]
    image: eka-backend:dev
    build:
      context: ../../backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../../backend:/app/backend
    ports:
      - "127.0.0.1:8000:8000"

  # The web app (profile app). Auth0 settings come from frontend/.env.local
  # (never committed). See docs/development/frontend.md.
  frontend:
    profiles: ["app"]
    build:
      context: ../../frontend
      target: dev
    image: eka-frontend:dev
    env_file:
      - path: ../../frontend/.env.local
        required: false
    environment:
      EKA_API_URL: http://api:8000
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  eka_dev_pgdata:
    name: eka_dev_pgdata
