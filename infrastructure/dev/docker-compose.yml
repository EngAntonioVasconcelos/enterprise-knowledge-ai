# PostgreSQL for local development.
# Data is kept in the named volume eka_dev_pgdata, so it survives restarts
# and "docker compose down". Only "docker compose down -v" deletes it.
# Values come from infrastructure/dev/.env (never committed); see
# docs/development/dev-database.md.
services:
  postgres:
    # PostgreSQL 18 with pgvector 0.8.2 (vector search, Phase 6).
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: eka-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:1996:5432"
    volumes:
      - eka_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The backend tools (tests, migrations, evaluations) in Linux, so the
  # Windows Python and its app controls are not involved. Profile tools:
  # not started by "up". See docs/development/backend-container.md.
  backend:
    profiles: ["tools"]
    build:
      context: ../../backend
    image: eka-backend:dev
    volumes:
      - ../../backend:/app/backend
      # The demo sales data, which the agent's red-team tests load (AL-5).
      - ../../infrastructure/demo-db/init:/app/infrastructure/demo-db/init:ro
    environment:
      # The disposable test database on the host (throwaway credentials).
      EKA_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://eka_test_admin:local-test-admin-only@host.docker.internal:1999/eka_test

  # The backend API for the web app (profile app). Same image as the
  # tools. No automatic reload: with the API and the worker each holding
  # the embedding model, the file watcher ran the Docker VM out of memory.
  # After a change to the backend, stop and start "up" again.
  api:
    profiles: ["app"]
    image: eka-backend:dev
    build:
      context: ../../backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ../../backend:/app/backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # The agent's data tool goes through the data gateway (AL-4).
      DATA_GATEWAY_URL: http://data-gateway:8100

  # The data gateway (profile app, AL-4): the only process that queries
  # customer databases, read-only, for the agent. It holds what the worker
  # holds (WORKER_DATABASE_URL, the master private key) and needs
  # DATA_GATEWAY_TOKEN. No published port: only the API reaches it, inside
  # the Docker network. See docs/development/data-gateway.md.
  data-gateway:
    profiles: ["app"]
    image: eka-backend:dev
    build:
      context: ../../backend
    command: ["python", "-m", "scripts.run_data_gateway"]
    volumes:
      - ../../backend:/app/backend
    restart: unless-stopped

  # The background worker (profile app): reads uploaded and synced files,
  # cuts them into passages and computes their vectors. Same image and
  # folder as the API, so both see the same local storage (var/storage) and
  # models (var/models). Connects with WORKER_DATABASE_URL and switches to
  # the eka_worker role in every transaction. See
  # docs/development/background-jobs.md.
  worker:
    profiles: ["app"]
    image: eka-backend:dev
    build:
      context: ../../backend
    command: ["python", "-m", "scripts.run_worker", "--watch"]
    volumes:
      - ../../backend:/app/backend
    restart: unless-stopped

  # The web app (profile app). Auth0 settings come from frontend/.env.local
  # (never committed). See docs/development/frontend.md.
  frontend:
    profiles: ["app"]
    build:
      context: ../../frontend
      target: dev
    image: eka-frontend:dev
    env_file:
      - path: ../../frontend/.env.local
        required: false
    environment:
      EKA_API_URL: http://api:8000
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  eka_dev_pgdata:
    name: eka_dev_pgdata
