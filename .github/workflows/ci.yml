name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: eka_test
          POSTGRES_USER: eka_test_admin
          POSTGRES_PASSWORD: local-test-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eka_test_admin -d eka_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EKA_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://eka_test_admin:local-test-admin-only@127.0.0.1:5432/eka_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://eka_test_admin:local-test-admin-only@127.0.0.1:5432/eka_test
      DATABASE_URL: postgresql+psycopg://eka_runtime:local-test-runtime-only@127.0.0.1:5432/eka_test
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check that migrations have a single head
        run: test "$(python -m alembic heads | wc -l)" -eq 1
      - name: Prepare an empty database (clean installation)
        run: python scripts/prepare_test_database.py
      - name: Check that models match the migrated schema
        run: python -m alembic check
      - name: Run all tests
        run: python -m pytest -q
